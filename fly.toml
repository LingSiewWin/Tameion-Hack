# Fly.io config for the public copy of Tameion (testnet only). Deploy with scripts/deploy_fly.sh:
# it creates the app if missing, sets the secrets from files under ~/.tameion without printing them
# (TAMEION_RELAYER_KEY, TAMEION_LEVEL1_INVITE, TAMEION_APP_ADMIN_TOKEN, ANTHROPIC_API_KEY), then deploys.
# Passkeys bind to the host name: once a judge opens an account, the app name (and so the URL) must not change.
app = "tameion-agents"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # PORT matches internal_port below. The image (Dockerfile ENV) puts every file the service writes
  # under /data, the volume: TAMEION_APP_DIR=/data/app, the book in /data/log, keys made on first use.
  PORT = "8080"
  TAMEION_APP_DIR = "/data/app"
  # The origin the pages and the agent card name; scripts/deploy_fly.sh overrides it when the app name differs.
  TAMEION_PUBLIC_URL = "https://tameion-agents.fly.dev"
  # The judge's five minutes (docs/115 §3): demo accounts funded by the relayer, gated by the invite word.
  TAMEION_DEMO = "1"
  # Demo mode is off without a vendor (demo.rs `enabled`): the address the demo bill pays (seat S17a's test EOA).
  TAMEION_DEMO_VENDOR = "0xE5E2d8dCC2038fd0A010A6e7845378b646e33854"
  # The model sees only a redacted copy (docs/116 §3); without ANTHROPIC_API_KEY the rule decides.
  TAMEION_REASONER = "cloud-redacted"
  # A pass when an account's wallet or policy moves USDC (two eth_getLogs per chain per tick).
  TAMEION_LEVEL1_WATCH_SECS = "60"
  # One scheduled agent pass per account per hour; due bills and the page's button still run between.
  TAMEION_LEVEL1_EVERY_SECS = "3600"
  # The relayer here is a dedicated demo key: keep 1 USDC (20 accounts' worth), not the treasury floor of 20 (P-291).
  TAMEION_DEMO_FLOOR_USDC = "1"
  TAMEION_CONTACT_URL = "https://discord.gg/rsVfYutFZg"
  TAMEION_REPO_URL = "https://github.com/lingsiewwin/Tameion-Hack"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine that never sleeps: the watcher and the due-bill pass run inside it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

# One volume, one machine (Fly maps them one to one); created by the first deploy.
[mounts]
  source = "tameion_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
