[package]
name = "desk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A small trader's physical book: double entry in the unit of the goods, the offset it implies, and a statement a lender can check."

# Pure, like `ledger`: no I/O, no clock, no venue. The operator feeds it
# milestones and venue read-backs.
[dependencies]
ledger.workspace = true
rust_decimal = { version = "1", features = ["macros"] }
serde.workspace = true
